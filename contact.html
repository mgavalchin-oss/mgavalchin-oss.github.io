<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Contact — Max Gavalchin</title>

  <link rel="stylesheet" href="style.css">

  <!-- Forum Font -->
  <link href="https://fonts.googleapis.com/css2?family=Forum&display=swap" rel="stylesheet">
</head>

<body>

  <!-- NAV -->
  <nav class="site-nav">

    <a href="index.html" class="nav-logo">MG</a>

    <ul class="nav-links">
      <li><a href="about.html" class="nav-link">About</a></li>
      <li><a href="index.html#portfolio" class="nav-link">Portfolio</a></li>
      <li><a href="contact.html" class="nav-link active">Contact</a></li>
    </ul>

  </nav>

  <!-- CONTACT PAGE -->
  <main class="contact-page">

    <section class="contact-layout">

      <!-- LEFT -->
      <div class="contact-info">

        <p class="contact-eyebrow">
          Contact
        </p>

        <h1 class="contact-heading">
          Max Gavalchin
        </h1>

        <p class="contact-description">
          For freelance inquiries, collaborations, commissions, or general conversation, feel free to reach out.
        </p>

      </div>

      <!-- RIGHT -->
      <div class="contact-links">

        <a href="mailto:mgavalchin@gmail.com" class="contact-item">
          <span class="contact-label">Email</span>
          <span class="contact-value">mgavalchin@gmail.com</span>
        </a>

        <a 
          href="https://www.instagram.com/kyungjun.archive"
          target="_blank"
          rel="noopener noreferrer"
          class="contact-item"
        >
          <span class="contact-label">Instagram</span>
          <span class="contact-value">@kyungjun.archive</span>
        </a>

        <a
          href="https://www.linkedin.com/in/max-gavalchin-350132305/"
          target="_blank"
          rel="noopener noreferrer"
          class="contact-item"
        >
          <span class="contact-label">LinkedIn</span>
          <span class="contact-value">View Profile</span>
        </a>

      </div>

    </section>

  </main>

</body>
